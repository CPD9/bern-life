<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-labelledby="t d">
  <title id="t">Ask in your words</title>
  <desc id="d">The question "blood sugar sensor" becomes extra search terms (CGM, continuous glucose monitoring, Blutzuckersensor), which are search terms and not facts. Full-text search and meaning search run together and merge into one ranking. Each result card carries a link to its evidence. Example data is invented.</desc>
  <style>
    text { font-family: ui-rounded, "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bg { fill: #eef4fa; }
    .card { fill: #ffffff; stroke: #dfe6ee; }
    .chip { fill: #eef1f4; }
    .ink { fill: #14202b; }
    .muted { fill: #5b6773; }
    .green { fill: #13804a; }
    .green-line { stroke: #13804a; }
    .flow { stroke: #9aa8b6; }
    .badge { fill: #14202b; }
    .on-badge { fill: #ffffff; }
    .on-green { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1b2a; }
      .card { fill: #17212d; stroke: #2a3a4d; }
      .chip { fill: #223041; }
      .ink { fill: #eef3f8; }
      .muted { fill: #a3b0bd; }
      .green { fill: #2fb36b; }
      .green-line { stroke: #2fb36b; }
      .flow { stroke: #4b5d71; }
      .badge { fill: #eef3f8; }
      .on-badge { fill: #14202b; }
      .on-green { fill: #08130d; }
    }

    /* Resting styles are the last frame; with motion reduced the picture is complete. */
    .w1 { animation: w1 12s infinite; }
    .w2 { animation: w2 12s infinite; }
    .w3 { animation: w3 12s infinite; }
    .t1 { animation: t1 12s infinite; }
    .t2 { animation: t2 12s infinite; }
    .t3 { animation: t3 12s infinite; }
    .lanes { animation: lanes 12s infinite; }
    .merge { animation: merge 12s infinite; }
    .r1 { animation: r1 12s infinite; }
    .r2 { animation: r2 12s infinite; }

    @keyframes w1 { 0%, 2% { opacity: 0; } 5%, 100% { opacity: 1; } }
    @keyframes w2 { 0%, 6% { opacity: 0; } 9%, 100% { opacity: 1; } }
    @keyframes w3 { 0%, 10% { opacity: 0; } 13%, 100% { opacity: 1; } }
    @keyframes t1 { 0%, 17% { opacity: 0; transform: translateX(-24px); } 22%, 100% { opacity: 1; transform: none; } }
    @keyframes t2 { 0%, 21% { opacity: 0; transform: translateX(-24px); } 26%, 100% { opacity: 1; transform: none; } }
    @keyframes t3 { 0%, 25% { opacity: 0; transform: translateX(-24px); } 30%, 100% { opacity: 1; transform: none; } }
    @keyframes lanes { 0%, 34% { opacity: 0; } 42%, 100% { opacity: 1; } }
    @keyframes merge { 0%, 46% { opacity: 0; transform: scale(0.9); } 52%, 100% { opacity: 1; transform: none; } }
    @keyframes r1 { 0%, 58% { opacity: 0; transform: translateY(16px); } 64%, 100% { opacity: 1; transform: none; } }
    @keyframes r2 { 0%, 63% { opacity: 0; transform: translateY(16px); } 69%, 100% { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect class="bg" width="800" height="380" rx="24"/>
  <text class="ink" x="32" y="42" font-size="20" font-weight="800">Ask in your words</text>
  <text class="muted" x="32" y="64" font-size="13">Your words become search terms; words and meaning are searched together; every result keeps its evidence.</text>

  <!-- The question -->
  <rect class="card" x="32" y="96" width="250" height="48" rx="24"/>
  <circle cx="58" cy="118" r="7" fill="none" class="flow" stroke-width="2.4"/>
  <path d="M63 123l6 6" class="flow" stroke-width="2.4" stroke-linecap="round"/>
  <text class="ink w1" x="80" y="125" font-size="15" font-weight="700">blood</text>
  <text class="ink w2" x="126" y="125" font-size="15" font-weight="700">sugar</text>
  <text class="ink w3" x="174" y="125" font-size="15" font-weight="700">sensor</text>
  <text class="muted" x="32" y="176" font-size="12">German, English or French.</text>
  <text class="muted" x="32" y="194" font-size="12">Apertus 70B suggests the extra terms;</text>
  <text class="muted" x="32" y="212" font-size="12">every answer is cached, so a rerun</text>
  <text class="muted" x="32" y="230" font-size="12">needs no GPU.</text>

  <path d="M282 120h22" class="flow" stroke-width="2" fill="none"/>

  <!-- Expanded terms -->
  <g class="t1">
    <rect class="chip" x="310" y="88" width="230" height="30" rx="15"/>
    <text class="ink" x="326" y="108" font-size="13" font-weight="700">CGM</text>
    <text class="muted" x="526" y="108" font-size="11" text-anchor="end">acronym</text>
  </g>
  <g class="t2">
    <rect class="chip" x="310" y="124" width="230" height="30" rx="15"/>
    <text class="ink" x="326" y="144" font-size="13" font-weight="700">continuous glucose monitoring</text>
  </g>
  <g class="t3">
    <rect class="chip" x="310" y="160" width="230" height="30" rx="15"/>
    <text class="ink" x="326" y="180" font-size="13" font-weight="700">Blutzuckersensor</text>
    <text class="muted" x="526" y="180" font-size="11" text-anchor="end">German</text>
  </g>
  <text class="muted t3" x="310" y="210" font-size="11">Search terms only, never facts about anyone.</text>

  <!-- Two searches, one ranking -->
  <g class="lanes">
    <path d="M540 103c24 0 24 6 48 6M540 175c24 0 24-6 48-6" class="flow" stroke-width="2" fill="none"/>
    <rect class="card" x="588" y="94" width="180" height="30" rx="15"/>
    <text class="ink" x="604" y="114" font-size="12" font-weight="700">Words · full-text</text>
    <rect class="card" x="588" y="154" width="180" height="30" rx="15"/>
    <text class="ink" x="604" y="174" font-size="12" font-weight="700">Meaning · vectors</text>
  </g>
  <g class="merge">
    <path d="M768 109c24 0 24 114 0 114M768 169c14 0 14 54 0 54" class="flow" stroke-width="2" fill="none"/>
    <rect class="green" x="588" y="208" width="180" height="30" rx="15"/>
    <text class="on-green" x="678" y="228" font-size="12" font-weight="800" text-anchor="middle">One ranking</text>
  </g>

  <!-- Results with evidence -->
  <g class="r1">
    <rect class="card" x="32" y="258" width="360" height="86" rx="16"/>
    <circle class="badge" cx="58" cy="284" r="12"/>
    <text class="on-badge" x="58" y="289" font-size="12" font-weight="800" text-anchor="middle">1</text>
    <text class="ink" x="78" y="289" font-size="15" font-weight="800">Ada Muster · Sensor Lab</text>
    <rect class="chip" x="48" y="304" width="210" height="26" rx="13"/>
    <text class="ink" x="60" y="322" font-size="12" font-weight="700">continuous glucose monitoring</text>
    <text class="green" x="376" y="322" font-size="12" font-weight="800" text-anchor="end">evidence ↗</text>
  </g>
  <g class="r2">
    <rect class="card" x="408" y="258" width="360" height="86" rx="16"/>
    <circle class="badge" cx="434" cy="284" r="12"/>
    <text class="on-badge" x="434" y="289" font-size="12" font-weight="800" text-anchor="middle">2</text>
    <text class="ink" x="454" y="289" font-size="15" font-weight="800">Example Diabetes Lab</text>
    <rect class="chip" x="424" y="304" width="160" height="26" rx="13"/>
    <text class="ink" x="436" y="322" font-size="12" font-weight="700">wearable biosensors</text>
    <text class="green" x="752" y="322" font-size="12" font-weight="800" text-anchor="end">evidence ↗</text>
  </g>

  <text class="muted" x="768" y="366" font-size="10" text-anchor="end">Example data is invented.</text>
</svg>
