<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-labelledby="t d">
  <title id="t">A company brief</title>
  <desc id="d">A company uploads a project brief as a PDF. Each need is lifted out together with the sentence it came from. Matched experts are listed with how well they cover each need, and gaps are shown. The matching places light up on the map of Bern by rank. Example data is invented.</desc>
  <style>
    text { font-family: ui-rounded, "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bg { fill: #eef4fa; }
    .card { fill: #ffffff; stroke: #dfe6ee; }
    .chip { fill: #eef1f4; }
    .ink { fill: #14202b; }
    .muted { fill: #5b6773; }
    .bar { fill: #d9e1ea; }
    .mark { fill: #fff3b0; }
    .green { fill: #13804a; }
    .on-green { fill: #ffffff; }
    .warn { fill: #fff1d6; }
    .warn-ink { fill: #6b3a00; }
    .pdf { fill: #b42318; }
    .link { stroke: #9aa8b6; }
    .river { stroke: #7fb3e6; }
    .land { fill: #dfeadf; }
    .place { fill: #9aa8b6; }
    .glow { fill: #13804a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1b2a; }
      .card { fill: #17212d; stroke: #2a3a4d; }
      .chip { fill: #223041; }
      .ink { fill: #eef3f8; }
      .muted { fill: #a3b0bd; }
      .bar { fill: #2a3a4d; }
      .mark { fill: #4a4120; }
      .green { fill: #2fb36b; }
      .on-green { fill: #08130d; }
      .warn { fill: #3a2a10; }
      .warn-ink { fill: #ffd9a0; }
      .pdf { fill: #ff8a80; }
      .link { stroke: #4b5d71; }
      .river { stroke: #3a6ea5; }
      .land { fill: #1d2c24; }
      .place { fill: #4b5d71; }
      .glow { fill: #2fb36b; }
    }

    /* Resting styles are the last frame; with motion reduced the picture is complete. */
    .m1 { animation: m1 12s infinite; }
    .m2 { animation: m2 12s infinite; }
    .n1 { animation: n1 12s infinite; }
    .n2 { animation: n2 12s infinite; }
    .e1 { animation: e1 12s infinite; }
    .e2 { animation: e2 12s infinite; }
    .gap { animation: gap 12s infinite; }
    .p1 { animation: p1 12s infinite; }
    .p2 { animation: p2 12s infinite; }
    .halo { opacity: 0.25; animation: halo 12s infinite; }

    @keyframes m1 { 0%, 6% { opacity: 0; } 11%, 100% { opacity: 1; } }
    @keyframes m2 { 0%, 12% { opacity: 0; } 17%, 100% { opacity: 1; } }
    @keyframes n1 { 0%, 18% { opacity: 0; transform: translateX(-20px); } 25%, 100% { opacity: 1; transform: none; } }
    @keyframes n2 { 0%, 24% { opacity: 0; transform: translateX(-20px); } 31%, 100% { opacity: 1; transform: none; } }
    @keyframes e1 { 0%, 38% { opacity: 0; transform: translateY(12px); } 45%, 100% { opacity: 1; transform: none; } }
    @keyframes e2 { 0%, 44% { opacity: 0; transform: translateY(12px); } 51%, 100% { opacity: 1; transform: none; } }
    @keyframes gap { 0%, 52% { opacity: 0; } 57%, 100% { opacity: 1; } }
    @keyframes p1 { 0%, 60% { opacity: 0; } 65%, 100% { opacity: 1; } }
    @keyframes p2 { 0%, 66% { opacity: 0; } 71%, 100% { opacity: 1; } }
    @keyframes halo { 0%, 60% { opacity: 0; } 70% { opacity: 0.45; } 80% { opacity: 0.15; } 90%, 100% { opacity: 0.25; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect class="bg" width="800" height="380" rx="24"/>
  <text class="ink" x="32" y="42" font-size="20" font-weight="800">A company brief</text>
  <text class="muted" x="32" y="64" font-size="13">Upload a project PDF. Each need keeps the sentence it came from; matched experts light up on the map.</text>

  <!-- The brief -->
  <path class="card" d="M46 88h116l22 22v218a12 12 0 0 1-12 12H46a12 12 0 0 1-12-12V100a12 12 0 0 1 12-12z"/>
  <rect class="pdf" x="46" y="100" width="34" height="18" rx="4"/>
  <text x="63" y="113" font-size="10" font-weight="800" text-anchor="middle" fill="#ffffff">PDF</text>
  <text class="muted" x="88" y="113" font-size="10">project-brief.pdf</text>
  <rect class="bar" x="46" y="132" width="124" height="7" rx="3.5"/>
  <rect class="mark m1" x="42" y="146" width="136" height="36" rx="5"/>
  <text class="ink" x="48" y="160" font-size="10">…developing a wearable</text>
  <text class="ink" x="48" y="174" font-size="10">glucose sensor…</text>
  <rect class="bar" x="46" y="194" width="118" height="7" rx="3.5"/>
  <rect class="bar" x="46" y="210" width="128" height="7" rx="3.5"/>
  <rect class="mark m2" x="42" y="224" width="136" height="36" rx="5"/>
  <text class="ink" x="48" y="238" font-size="10">…a partner for clinical</text>
  <text class="ink" x="48" y="252" font-size="10">data analysis…</text>
  <rect class="bar" x="46" y="272" width="110" height="7" rx="3.5"/>
  <rect class="bar" x="46" y="288" width="124" height="7" rx="3.5"/>
  <text class="muted" x="46" y="322" font-size="10">Read once, not kept.</text>

  <!-- Needs, each tied to its sentence -->
  <g class="n1">
    <path class="link" d="M178 164C200 164 200 112 222 112" stroke-width="1.6" stroke-dasharray="4 3" fill="none"/>
    <rect class="chip" x="222" y="98" width="230" height="28" rx="14"/>
    <text class="ink" x="236" y="117" font-size="12" font-weight="800">Need: wearable glucose sensor</text>
  </g>
  <g class="n2">
    <path class="link" d="M178 242C200 242 200 148 222 148" stroke-width="1.6" stroke-dasharray="4 3" fill="none"/>
    <rect class="chip" x="222" y="134" width="230" height="28" rx="14"/>
    <text class="ink" x="236" y="153" font-size="12" font-weight="800">Need: clinical data analysis</text>
  </g>

  <!-- Matched experts and how they cover each need -->
  <g class="e1">
    <rect class="card" x="222" y="184" width="230" height="56" rx="14"/>
    <text class="ink" x="238" y="206" font-size="13" font-weight="800">1 · Ada Muster</text>
    <rect class="green" x="238" y="214" width="150" height="18" rx="9"/>
    <text class="on-green" x="313" y="227" font-size="10" font-weight="800" text-anchor="middle">covers the sensor need</text>
  </g>
  <g class="e2">
    <rect class="card" x="222" y="248" width="230" height="56" rx="14"/>
    <text class="ink" x="238" y="270" font-size="13" font-weight="800">2 · Beat Beispiel</text>
    <rect class="warn" x="238" y="278" width="174" height="18" rx="9"/>
    <text class="warn-ink" x="325" y="291" font-size="10" font-weight="800" text-anchor="middle">partly covers the data need</text>
  </g>
  <text class="muted gap" x="222" y="324" font-size="11">Gap shown: no one fully covers</text>
  <text class="muted gap" x="222" y="339" font-size="11">clinical data analysis.</text>

  <!-- Bern: the Aare loop and the places -->
  <rect class="card" x="480" y="88" width="288" height="252" rx="16"/>
  <rect class="land" x="492" y="100" width="264" height="228" rx="10"/>
  <path class="river" d="M492 150C560 140 640 120 700 150C770 186 742 270 676 274C616 278 608 230 566 238C522 246 520 292 512 328" stroke-width="12" stroke-linecap="round" fill="none"/>
  <circle class="place" cx="726" cy="118" r="7"/>
  <circle class="place" cx="534" cy="292" r="7"/>
  <circle class="place" cx="612" cy="302" r="7"/>
  <circle class="place" cx="520" cy="118" r="7"/>
  <circle class="glow halo" cx="600" cy="186" r="22"/>
  <circle class="glow halo" cx="686" cy="226" r="18"/>
  <g class="p1">
    <circle class="green" cx="600" cy="186" r="11"/>
    <text class="on-green" x="600" y="190" font-size="11" font-weight="800" text-anchor="middle">1</text>
  </g>
  <g class="p2">
    <circle class="green" cx="686" cy="226" r="10"/>
    <text class="on-green" x="686" y="230" font-size="10" font-weight="800" text-anchor="middle">2</text>
  </g>
  <text class="muted" x="624" y="334" font-size="10" text-anchor="middle">Stylised Bern, no map tiles</text>

  <text class="muted" x="768" y="366" font-size="10" text-anchor="end">Example data is invented.</text>
</svg>
