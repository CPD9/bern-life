<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-labelledby="t d">
  <title id="t">A company's brief</title>
  <desc id="d">A project brief as a PDF page. One sentence is highlighted and lifts out as a need, then a second. Three experts appear on the right, each with a bar per need reading Covers, Partly or Missing, and the gap is named in one line: nobody covers testing with older patients. Example data is invented.</desc>
  <style>
    text { font-family: ui-rounded, "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bg { fill: #eef4fa; }
    .card { fill: #ffffff; stroke: #dfe6ee; }
    .ink { fill: #14202b; }
    .muted { fill: #5b6773; }
    .bar { fill: #d9e1ea; }
    .mark { fill: #fff3b0; }
    .green { fill: #13804a; }
    .on-green { fill: #ffffff; }
    .amber { fill: #c98a16; }
    .red { fill: #b42318; }
    .on-red { fill: #ffffff; }
    .line { stroke: #dfe6ee; }
    .shadow { fill: #14202b; opacity: 0.07; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1b2a; }
      .card { fill: #17212d; stroke: #2a3a4d; }
      .ink { fill: #eef3f8; }
      .muted { fill: #a3b0bd; }
      .bar { fill: #2a3a4d; }
      .mark { fill: #4a4120; }
      .green { fill: #2fb36b; }
      .on-green { fill: #08130d; }
      .amber { fill: #e8b25a; }
      .red { fill: #ff8a80; }
      .on-red { fill: #14202b; }
      .line { stroke: #2a3a4d; }
      .shadow { fill: #000000; opacity: 0.3; }
    }

    /* Resting styles are the last frame, so with motion reduced the picture is complete. */
    .sweep { transform-box: fill-box; transform-origin: left center; }
    .m1 { animation: m1 12s cubic-bezier(.65, 0, .35, 1) infinite; }
    .m2 { animation: m2 12s cubic-bezier(.65, 0, .35, 1) infinite; }
    .n1 { animation: n1 12s cubic-bezier(.34, 1.3, .64, 1) infinite; }
    .n2 { animation: n2 12s cubic-bezier(.34, 1.3, .64, 1) infinite; }
    .e1 { animation: e1 12s ease-out infinite; }
    .e2 { animation: e2 12s ease-out infinite; }
    .e3 { animation: e3 12s ease-out infinite; }
    .grow { transform-box: fill-box; transform-origin: left center; }
    .g1 { animation: g1 12s ease-out infinite; }
    .g2 { animation: g2 12s ease-out infinite; }
    .g3 { animation: g3 12s ease-out infinite; }
    .g1 .grow { animation: w1 12s ease-out infinite; }
    .g2 .grow { animation: w2 12s ease-out infinite; }
    .g3 .grow { animation: w3 12s ease-out infinite; }
    .gap { animation: gap 12s ease-out infinite; }

    @keyframes m1 { 0%, 3% { transform: scaleX(0); } 9%, 100% { transform: scaleX(1); } }
    @keyframes n1 { 0%, 10% { opacity: 0; transform: translate(-248px, 36px) scale(0.9); } 17%, 100% { opacity: 1; transform: none; } }
    @keyframes m2 { 0%, 18% { transform: scaleX(0); } 24%, 100% { transform: scaleX(1); } }
    @keyframes n2 { 0%, 25% { opacity: 0; transform: translate(-248px, 30px) scale(0.9); } 32%, 100% { opacity: 1; transform: none; } }
    @keyframes e1 { 0%, 34% { opacity: 0; transform: translateX(16px); } 39%, 100% { opacity: 1; transform: none; } }
    @keyframes e2 { 0%, 38% { opacity: 0; transform: translateX(16px); } 43%, 100% { opacity: 1; transform: none; } }
    @keyframes e3 { 0%, 42% { opacity: 0; transform: translateX(16px); } 47%, 100% { opacity: 1; transform: none; } }
    @keyframes g1 { 0%, 48% { opacity: 0; } 54%, 100% { opacity: 1; } }
    @keyframes g2 { 0%, 52% { opacity: 0; } 58%, 100% { opacity: 1; } }
    @keyframes g3 { 0%, 56% { opacity: 0; } 62%, 100% { opacity: 1; } }
    @keyframes w1 { 0%, 48% { transform: scaleX(0); } 54%, 100% { transform: scaleX(1); } }
    @keyframes w2 { 0%, 52% { transform: scaleX(0); } 58%, 100% { transform: scaleX(1); } }
    @keyframes w3 { 0%, 56% { transform: scaleX(0); } 62%, 100% { transform: scaleX(1); } }
    @keyframes gap { 0%, 64% { opacity: 0; } 68%, 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect class="bg" width="800" height="380" rx="24"/>
  <text class="ink" x="32" y="42" font-size="20" font-weight="800">A company's brief</text>
  <text class="muted" x="32" y="64" font-size="13">Each need keeps its sentence from the PDF. Each expert shows what their cited claims cover.</text>

  <!-- The PDF page -->
  <rect class="shadow" x="34" y="90" width="240" height="250" rx="12"/>
  <path class="card" d="M44 84h200l28 28v210a12 12 0 0 1-12 12H44a12 12 0 0 1-12-12V96a12 12 0 0 1 12-12z"/>
  <path class="bar" d="M244 84v28h28z"/>
  <rect class="red" x="46" y="94" width="34" height="18" rx="4"/>
  <text class="on-red" x="63" y="107" font-size="10" font-weight="800" text-anchor="middle">PDF</text>
  <text class="muted" x="88" y="107" font-size="11">project-brief.pdf</text>
  <rect class="bar" x="46" y="128" width="200" height="8" rx="4"/>
  <rect class="bar" x="46" y="142" width="168" height="8" rx="4"/>
  <rect class="mark sweep m1" x="44" y="154" width="208" height="22" rx="5"/>
  <text class="ink" x="50" y="169" font-size="11" font-weight="600">needs continuous glucose sensing</text>
  <rect class="bar" x="46" y="188" width="190" height="8" rx="4"/>
  <rect class="bar" x="46" y="202" width="150" height="8" rx="4"/>
  <rect class="mark sweep m2" x="44" y="216" width="208" height="22" rx="5"/>
  <text class="ink" x="50" y="231" font-size="11" font-weight="600">tested with older patients at home</text>
  <rect class="bar" x="46" y="250" width="196" height="8" rx="4"/>
  <rect class="bar" x="46" y="264" width="160" height="8" rx="4"/>
  <rect class="bar" x="46" y="278" width="184" height="8" rx="4"/>
  <rect class="bar" x="46" y="292" width="120" height="8" rx="4"/>
  <rect class="bar" x="46" y="306" width="172" height="8" rx="4"/>

  <!-- The needs, lifted out -->
  <text class="muted" x="292" y="106" font-size="11" font-weight="700" letter-spacing="1">NEEDS</text>
  <g class="n1">
    <rect class="green" x="292" y="118" width="214" height="32" rx="16"/>
    <text class="on-green" x="399" y="139" font-size="13" font-weight="800" text-anchor="middle">continuous glucose sensing</text>
  </g>
  <g class="n2">
    <rect class="green" x="292" y="186" width="214" height="32" rx="16"/>
    <text class="on-green" x="399" y="207" font-size="13" font-weight="800" text-anchor="middle">testing with older patients</text>
  </g>
  <text class="muted" x="292" y="250" font-size="11">Each need keeps the sentence</text>
  <text class="muted" x="292" y="266" font-size="11">it was read from.</text>

  <!-- The experts -->
  <rect class="shadow" x="522" y="90" width="248" height="250" rx="14"/>
  <rect class="card" x="520" y="84" width="248" height="250" rx="14"/>
  <text class="muted" x="536" y="106" font-size="11" font-weight="700" letter-spacing="1">EXPERTS FOUND</text>

  <g class="e1">
    <text class="ink" x="536" y="132" font-size="14" font-weight="800">Dr. Example One</text>
    <text class="muted" x="536" y="150" font-size="11">glucose sensing</text>
    <rect class="bar" x="634" y="141" width="60" height="10" rx="5"/>
    <text class="muted" x="536" y="168" font-size="11">older patients</text>
    <rect class="bar" x="634" y="159" width="60" height="10" rx="5"/>
    <g class="g1">
      <rect class="green grow" x="634" y="141" width="60" height="10" rx="5"/>
      <text class="green" x="702" y="150" font-size="11" font-weight="800">Covers</text>
      <rect class="amber grow" x="634" y="159" width="30" height="10" rx="5"/>
      <text class="amber" x="702" y="168" font-size="11" font-weight="800">Partly</text>
    </g>
  </g>
  <line class="line" x1="536" y1="182" x2="752" y2="182"/>

  <g class="e2">
    <text class="ink" x="536" y="206" font-size="14" font-weight="800">Dr. Example Two</text>
    <text class="muted" x="536" y="224" font-size="11">glucose sensing</text>
    <rect class="bar" x="634" y="215" width="60" height="10" rx="5"/>
    <text class="muted" x="536" y="242" font-size="11">older patients</text>
    <rect class="bar" x="634" y="233" width="60" height="10" rx="5"/>
    <g class="g2">
      <rect class="green grow" x="634" y="215" width="60" height="10" rx="5"/>
      <text class="green" x="702" y="224" font-size="11" font-weight="800">Covers</text>
      <text class="red" x="702" y="242" font-size="11" font-weight="800">Missing</text>
    </g>
  </g>
  <line class="line" x1="536" y1="256" x2="752" y2="256"/>

  <g class="e3">
    <text class="ink" x="536" y="280" font-size="14" font-weight="800">Dr. Example Three</text>
    <text class="muted" x="536" y="298" font-size="11">glucose sensing</text>
    <rect class="bar" x="634" y="289" width="60" height="10" rx="5"/>
    <text class="muted" x="536" y="316" font-size="11">older patients</text>
    <rect class="bar" x="634" y="307" width="60" height="10" rx="5"/>
    <g class="g3">
      <rect class="amber grow" x="634" y="289" width="30" height="10" rx="5"/>
      <text class="amber" x="702" y="298" font-size="11" font-weight="800">Partly</text>
      <text class="red" x="702" y="316" font-size="11" font-weight="800">Missing</text>
    </g>
  </g>

  <!-- The gap, named -->
  <text class="red gap" x="292" y="364" font-size="14" font-weight="800">Nobody covers: testing with older patients</text>

  <text class="muted" x="768" y="372" font-size="10" text-anchor="end">Example data is invented.</text>
</svg>
