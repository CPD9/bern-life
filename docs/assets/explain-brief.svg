<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-labelledby="t d">
  <title id="t">A company brief</title>
  <desc id="d">A company uploads a project brief as a PDF. A scan runs down the page and each need is lifted out together with the sentence it came from. Matched experts fill bars showing how far they cover each need, and the gap is named. On the map of Bern the river draws itself and the matching places ripple and light up by rank. Example data is invented.</desc>
  <defs>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d6fd6" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#1d6fd6" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#1d6fd6" stop-opacity="0.6"/>
    </linearGradient>
    <clipPath id="sheet"><path d="M46 88h116l22 22v218a12 12 0 0 1-12 12H46a12 12 0 0 1-12-12V100a12 12 0 0 1 12-12z"/></clipPath>
  </defs>
  <style>
    text { font-family: ui-rounded, "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bg { fill: #eef4fa; }
    .card { fill: #ffffff; stroke: #dfe6ee; }
    .chip { fill: #eef1f4; }
    .ink { fill: #14202b; }
    .muted { fill: #5b6773; }
    .bar { fill: #d9e1ea; }
    .mark { fill: #fff3b0; }
    .green { fill: #13804a; }
    .on-green { fill: #ffffff; }
    .warn { fill: #e0a33a; }
    .pdf { fill: #b42318; }
    .link { stroke: #9aa8b6; }
    .river { stroke: #7fb3e6; }
    .land { fill: #dfeadf; }
    .place { fill: #9aa8b6; }
    .ripple { fill: none; stroke: #13804a; }
    .shadow { fill: #14202b; opacity: 0.07; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1b2a; }
      .card { fill: #17212d; stroke: #2a3a4d; }
      .chip { fill: #223041; }
      .ink { fill: #eef3f8; }
      .muted { fill: #a3b0bd; }
      .bar { fill: #2a3a4d; }
      .mark { fill: #4a4120; }
      .green { fill: #2fb36b; }
      .on-green { fill: #08130d; }
      .warn { fill: #e8b25a; }
      .pdf { fill: #ff8a80; }
      .link { stroke: #4b5d71; }
      .river { stroke: #3a6ea5; }
      .land { fill: #1d2c24; }
      .place { fill: #4b5d71; }
      .ripple { stroke: #2fb36b; }
      .shadow { fill: #000000; opacity: 0.3; }
    }

    /* Resting styles are the last frame, so with motion reduced the picture is complete. */
    .box { transform-box: fill-box; transform-origin: left center; }
    .pop { transform-box: fill-box; transform-origin: center; }
    .draw { stroke-dasharray: 1; }
    .scan { opacity: 0; animation: scan 12s cubic-bezier(.45, 0, .55, 1) infinite; }
    .m1 { animation: m1 12s cubic-bezier(.65, 0, .35, 1) infinite; }
    .m2 { animation: m2 12s cubic-bezier(.65, 0, .35, 1) infinite; }
    .l1 { animation: l1 12s ease-out infinite; }
    .l2 { animation: l2 12s ease-out infinite; }
    .n1 { animation: n1 12s cubic-bezier(.34, 1.56, .64, 1) infinite; }
    .n2 { animation: n2 12s cubic-bezier(.34, 1.56, .64, 1) infinite; }
    .e1 { animation: e1 12s cubic-bezier(.34, 1.4, .64, 1) infinite; }
    .e2 { animation: e2 12s cubic-bezier(.34, 1.4, .64, 1) infinite; }
    .f1 { animation: f1 12s cubic-bezier(.65, 0, .35, 1) infinite; }
    .f2 { transform: scaleX(0.5); animation: f2 12s cubic-bezier(.65, 0, .35, 1) infinite; }
    .gap { animation: gap 12s ease-out infinite; }
    .aare { animation: aare 12s cubic-bezier(.45, 0, .55, 1) infinite; }
    .p1 { animation: p1 12s cubic-bezier(.34, 1.8, .64, 1) infinite; }
    .p2 { animation: p2 12s cubic-bezier(.34, 1.8, .64, 1) infinite; }
    .waves { opacity: 0; animation: waves 12s linear infinite; }
    .wave { animation: wave 1.6s ease-out infinite; }
    .w2 { animation-delay: -0.8s; }

    @keyframes scan { 0%, 3% { opacity: 0; transform: translateY(0); } 5% { opacity: 1; } 27% { opacity: 1; transform: translateY(196px); } 30%, 100% { opacity: 0; transform: translateY(196px); } }
    @keyframes m1 { 0%, 9% { transform: scaleX(0); } 13%, 100% { transform: scaleX(1); } }
    @keyframes m2 { 0%, 19% { transform: scaleX(0); } 23%, 100% { transform: scaleX(1); } }
    @keyframes l1 { 0%, 13% { stroke-dashoffset: 1; } 18%, 100% { stroke-dashoffset: 0; } }
    @keyframes l2 { 0%, 23% { stroke-dashoffset: 1; } 28%, 100% { stroke-dashoffset: 0; } }
    @keyframes n1 { 0%, 17% { opacity: 0; transform: scale(0.6); } 21%, 100% { opacity: 1; transform: scale(1); } }
    @keyframes n2 { 0%, 27% { opacity: 0; transform: scale(0.6); } 31%, 100% { opacity: 1; transform: scale(1); } }
    @keyframes e1 { 0%, 35% { opacity: 0; transform: translateY(20px); } 40%, 100% { opacity: 1; transform: none; } }
    @keyframes e2 { 0%, 41% { opacity: 0; transform: translateY(20px); } 46%, 100% { opacity: 1; transform: none; } }
    @keyframes f1 { 0%, 40% { transform: scaleX(0); } 47%, 100% { transform: scaleX(1); } }
    @keyframes f2 { 0%, 46% { transform: scaleX(0); } 52%, 100% { transform: scaleX(0.5); } }
    @keyframes gap { 0%, 53% { opacity: 0; } 58%, 100% { opacity: 1; } }
    @keyframes aare { 0%, 56% { stroke-dashoffset: 1; } 68%, 100% { stroke-dashoffset: 0; } }
    @keyframes p1 { 0%, 68% { opacity: 0; transform: scale(0); } 72%, 100% { opacity: 1; transform: scale(1); } }
    @keyframes p2 { 0%, 72% { opacity: 0; transform: scale(0); } 76%, 100% { opacity: 1; transform: scale(1); } }
    @keyframes waves { 0%, 69% { opacity: 0; } 72%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes wave { 0% { transform: scale(0.5); opacity: 0.8; } 100% { transform: scale(2.6); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect class="bg" width="800" height="380" rx="24"/>
  <text class="ink" x="32" y="42" font-size="20" font-weight="800">A company brief</text>
  <text class="muted" x="32" y="64" font-size="13">Upload a project PDF. Each need keeps the sentence it came from; matched experts light up on the map.</text>

  <!-- The brief, scanned -->
  <path class="shadow" d="M48 94h116l22 22v218a12 12 0 0 1-12 12H48a12 12 0 0 1-12-12V106a12 12 0 0 1 12-12z"/>
  <path class="card" d="M46 88h116l22 22v218a12 12 0 0 1-12 12H46a12 12 0 0 1-12-12V100a12 12 0 0 1 12-12z"/>
  <rect class="pdf" x="46" y="100" width="34" height="18" rx="4"/>
  <text x="63" y="113" font-size="10" font-weight="800" text-anchor="middle" fill="#ffffff">PDF</text>
  <text class="muted" x="88" y="113" font-size="10">project-brief.pdf</text>
  <rect class="bar" x="46" y="132" width="124" height="7" rx="3.5"/>
  <rect class="mark box m1" x="42" y="146" width="136" height="36" rx="5"/>
  <text class="ink" x="48" y="160" font-size="10">…developing a wearable</text>
  <text class="ink" x="48" y="174" font-size="10">glucose sensor…</text>
  <rect class="bar" x="46" y="194" width="118" height="7" rx="3.5"/>
  <rect class="bar" x="46" y="210" width="128" height="7" rx="3.5"/>
  <rect class="mark box m2" x="42" y="224" width="136" height="36" rx="5"/>
  <text class="ink" x="48" y="238" font-size="10">…a partner for clinical</text>
  <text class="ink" x="48" y="252" font-size="10">data analysis…</text>
  <rect class="bar" x="46" y="272" width="110" height="7" rx="3.5"/>
  <rect class="bar" x="46" y="288" width="124" height="7" rx="3.5"/>
  <text class="muted" x="46" y="322" font-size="10">Read once, not kept.</text>
  <g clip-path="url(#sheet)">
    <rect class="scan" x="34" y="104" width="150" height="34" fill="url(#scan)"/>
  </g>

  <!-- Needs, each drawn out of its sentence -->
  <path class="link draw l1" d="M178 164C200 164 200 112 222 112" pathLength="1" stroke-width="1.8" fill="none"/>
  <path class="link draw l2" d="M178 242C200 242 200 148 222 148" pathLength="1" stroke-width="1.8" fill="none"/>
  <g class="pop n1">
    <rect class="chip" x="222" y="98" width="230" height="28" rx="14"/>
    <text class="ink" x="236" y="117" font-size="12" font-weight="800">Need: wearable glucose sensor</text>
  </g>
  <g class="pop n2">
    <rect class="chip" x="222" y="134" width="230" height="28" rx="14"/>
    <text class="ink" x="236" y="153" font-size="12" font-weight="800">Need: clinical data analysis</text>
  </g>

  <!-- Matched experts and how far they cover each need -->
  <g class="e1">
    <rect class="shadow" x="224" y="190" width="230" height="56" rx="14"/>
    <rect class="card" x="222" y="184" width="230" height="56" rx="14"/>
    <text class="ink" x="238" y="206" font-size="13" font-weight="800">1 · Ada Muster</text>
    <rect class="bar" x="238" y="216" width="100" height="10" rx="5"/>
    <rect class="green box f1" x="238" y="216" width="100" height="10" rx="5"/>
    <text class="muted" x="346" y="225" font-size="10">sensor need: covered</text>
  </g>
  <g class="e2">
    <rect class="shadow" x="224" y="254" width="230" height="56" rx="14"/>
    <rect class="card" x="222" y="248" width="230" height="56" rx="14"/>
    <text class="ink" x="238" y="270" font-size="13" font-weight="800">2 · Beat Beispiel</text>
    <rect class="bar" x="238" y="280" width="100" height="10" rx="5"/>
    <rect class="warn box f2" x="238" y="280" width="100" height="10" rx="5"/>
    <text class="muted" x="346" y="289" font-size="10">data need: partly</text>
  </g>
  <text class="muted gap" x="222" y="324" font-size="11">Gap shown: no one fully covers</text>
  <text class="muted gap" x="222" y="339" font-size="11">clinical data analysis.</text>

  <!-- Bern: the Aare draws itself, the places light up -->
  <rect class="shadow" x="482" y="94" width="288" height="252" rx="16"/>
  <rect class="card" x="480" y="88" width="288" height="252" rx="16"/>
  <rect class="land" x="492" y="100" width="264" height="228" rx="10"/>
  <path class="river draw aare" d="M492 150C560 140 640 120 700 150C770 186 742 270 676 274C616 278 608 230 566 238C522 246 520 292 512 328" pathLength="1" stroke-width="12" stroke-linecap="round" fill="none"/>
  <circle class="place" cx="726" cy="118" r="7"/>
  <circle class="place" cx="534" cy="292" r="7"/>
  <circle class="place" cx="612" cy="302" r="7"/>
  <circle class="place" cx="520" cy="118" r="7"/>
  <g class="waves">
    <circle class="ripple pop wave" cx="600" cy="186" r="12" stroke-width="2"/>
    <circle class="ripple pop wave w2" cx="600" cy="186" r="12" stroke-width="2"/>
    <circle class="ripple pop wave" cx="686" cy="226" r="11" stroke-width="2"/>
    <circle class="ripple pop wave w2" cx="686" cy="226" r="11" stroke-width="2"/>
  </g>
  <g class="pop p1">
    <circle class="green" cx="600" cy="186" r="12"/>
    <text class="on-green" x="600" y="190" font-size="11" font-weight="800" text-anchor="middle">1</text>
  </g>
  <g class="pop p2">
    <circle class="green" cx="686" cy="226" r="11"/>
    <text class="on-green" x="686" y="230" font-size="10" font-weight="800" text-anchor="middle">2</text>
  </g>
  <text class="muted" x="624" y="334" font-size="10" text-anchor="middle">Stylised Bern, no map tiles</text>

  <text class="muted" x="768" y="366" font-size="10" text-anchor="end">Example data is invented.</text>
</svg>
