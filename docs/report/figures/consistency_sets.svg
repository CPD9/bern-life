<text x="12.0" y="190.0" font-size="10" fill="#4b5260" text-anchor="start">Each set holds wordings of one need (eval/consistency.jsonl). Jaccard:</text>
<text x="12.0" y="203.5" font-size="10" fill="#4b5260" text-anchor="start">the mean overlap of the top-10 profile ids over every pair of wordings.</text>
<text x="12.0" y="217.0" font-size="10" fill="#4b5260" text-anchor="start">The second bar: the mean share of a wording's top 10 that the set's first</text>
<text x="12.0" y="230.5" font-size="10" fill="#4b5260" text-anchor="start">wording also finds. The right column counts the wordings whose query</text>
<text x="12.0" y="244.0" font-size="10" fill="#4b5260" text-anchor="start">expansion was recorded; the others were searched plain.</text>
