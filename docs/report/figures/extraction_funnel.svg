<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 227" width="360" height="227" role="img" aria-labelledby="title" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">From pages to profiles with evidence</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<path d="M159.8,35V126.0" stroke="#c3c1b8"/>
<text x="159.8" y="138.0" font-size="10" fill="#868b94" text-anchor="middle">0</text>
<path d="M219.5,35V126.0" stroke="#e6e4de"/>
<text x="219.5" y="138.0" font-size="10" fill="#868b94" text-anchor="middle">10,000</text>
<path d="M279.2,35V126.0" stroke="#e6e4de"/>
<text x="279.2" y="138.0" font-size="10" fill="#868b94" text-anchor="middle">20,000</text>
<text x="151.8" y="48.4" font-size="11" fill="#1f2430" text-anchor="end">Public pages stored</text>
<path d="M159.8,40.0h18.0a2.0,2.0 0 0 1 2.0,2.0v5.0a2.0,2.0 0 0 1 -2.0,2.0h-18.0z" fill="#3d6fb6"><title>Public pages stored, count: 3,351</title></path>
<text x="183.8" y="48.0" font-size="10" fill="#4b5260" text-anchor="start">3,351</text>
<text x="151.8" y="66.3" font-size="11" fill="#1f2430" text-anchor="end">Model proposals</text>
<path d="M159.8,58.0h97.7a2.0,2.0 0 0 1 2.0,2.0v5.0a2.0,2.0 0 0 1 -2.0,2.0h-97.7z" fill="#3d6fb6"><title>Model proposals, count: about 16,700</title></path>
<text x="263.5" y="66.0" font-size="10" fill="#4b5260" text-anchor="start">about 16,700</text>
<text x="151.8" y="84.3" font-size="11" fill="#1f2430" text-anchor="end">Not on the page: dropped</text>
<path d="M159.8,76.0h4.9a2.0,2.0 0 0 1 2.0,2.0v5.0a2.0,2.0 0 0 1 -2.0,2.0h-4.9z" fill="#c8102e"><title>Not on the page: dropped, count: 1,151</title></path>
<text x="170.7" y="84.0" font-size="10" fill="#4b5260" text-anchor="start">1,151</text>
<text x="151.8" y="102.3" font-size="11" fill="#1f2430" text-anchor="end">Profiles of the three sources</text>
<path d="M159.8,94.0h17.9a2.0,2.0 0 0 1 2.0,2.0v5.0a2.0,2.0 0 0 1 -2.0,2.0h-17.9z" fill="#3d6fb6"><title>Profiles of the three sources, count: 3,336</title></path>
<text x="183.7" y="102.0" font-size="10" fill="#4b5260" text-anchor="start">3,336</text>
<text x="151.8" y="120.3" font-size="11" fill="#1f2430" text-anchor="end">Claims with evidence</text>
<path d="M159.8,112.0h27.1a2.0,2.0 0 0 1 2.0,2.0v5.0a2.0,2.0 0 0 1 -2.0,2.0h-27.1z" fill="#3d6fb6"><title>Claims with evidence, count: 4,877</title></path>
<text x="192.9" y="120.0" font-size="10" fill="#4b5260" text-anchor="start">4,877</text>
<text x="12.0" y="157.0" font-size="10" fill="#4b5260" text-anchor="start">From the stored pages to the profiles: Apertus proposes values with their</text>
<text x="12.0" y="170.5" font-size="10" fill="#4b5260" text-anchor="start">sentence, and a proposal whose sentence is not on the page is dropped</text>
<text x="12.0" y="184.0" font-size="10" fill="#4b5260" text-anchor="start">(6.9% of the proposals). The profiles are 2,922 people, 187 units, 85</text>
<text x="12.0" y="197.5" font-size="10" fill="#4b5260" text-anchor="start">projects and 142 facilities, with 1,843 relations between them; every</text>
<text x="12.0" y="211.0" font-size="10" fill="#4b5260" text-anchor="start">claim carries a sentence found on its page word for word.</text>
</svg>
