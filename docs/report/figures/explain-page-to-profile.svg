<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-labelledby="t d">
  <title id="t">From page to profile</title>
  <desc id="d">A sentence on a public page is marked, carried to the verifier, checked word for word against the page and accepted, then lands in the profile as a claim with its evidence. A model proposal that is not on the page hits the verifier, is rejected and falls away. Example data is invented.</desc>
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fb36b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2fb36b" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#2fb36b" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="gate-shape"><rect x="360" y="100" width="80" height="200" rx="40"/></clipPath>
  </defs>
  <style>
    text { font-family: ui-rounded, "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bg { fill: #eef4fa; }
    .card { fill: #ffffff; stroke: #dfe6ee; }
    .ink { fill: #14202b; }
    .muted { fill: #5b6773; }
    .bar { fill: #d9e1ea; }
    .mark { fill: #fff3b0; }
    .green { fill: #13804a; }
    .on-green { fill: #ffffff; }
    .red { fill: #b42318; }
    .red-line { stroke: #b42318; }
    .ring { fill: none; stroke: #5b6773; }
    .glyph { fill: none; stroke: #ffffff; }
    .shadow { fill: #14202b; opacity: 0.07; }
    /* Resting styles are the last frame, so with motion reduced the picture is complete. */
    .sweep { transform-box: fill-box; transform-origin: left center; }
    .traveller { opacity: 0; }
    .beam { opacity: 0; }
    .ok { opacity: 0; }
    .ok .draw { stroke-dasharray: 1; }
    .no { opacity: 0; }
    .no .draw { stroke-dasharray: 1; }
    .claim { }
    .evidence { }
    .proposal { transform-box: fill-box; transform-origin: center; }
    .dropped { }
  </style>
  <rect class="bg" width="800" height="380" rx="24"/>
  <text class="ink" x="32" y="42" font-size="20" font-weight="800">From page to profile</text>
  <text class="muted" x="32" y="64" font-size="13">The model may propose. Only a sentence found on the page, word for word, becomes a claim.</text>
  <!-- The public page -->
  <rect class="shadow" x="34" y="94" width="240" height="220" rx="14"/>
  <rect class="card" x="32" y="88" width="240" height="220" rx="14"/>
  <text class="muted" x="46" y="110" font-size="11">example-institute.test/team/ada-muster</text>
  <rect class="bar" x="32" y="120" width="240" height="1"/>
  <text class="ink" x="46" y="148" font-size="15" font-weight="800">Dr. Ada Muster</text>
  <rect class="mark sweep" x="40" y="158" width="176" height="24" rx="5"/>
  <text class="ink" x="46" y="175" font-size="13">Group Leader, Sensor Lab</text>
  <rect class="bar" x="46" y="198" width="200" height="8" rx="4"/>
  <rect class="bar" x="46" y="216" width="168" height="8" rx="4"/>
  <rect class="bar" x="46" y="234" width="188" height="8" rx="4"/>
  <rect class="bar" x="46" y="262" width="150" height="8" rx="4"/>
  <rect class="bar" x="46" y="280" width="120" height="8" rx="4"/>
  <!-- The verifier -->
  <rect class="shadow" x="362" y="106" width="80" height="200" rx="40"/>
  <rect class="card" x="360" y="100" width="80" height="200" rx="40"/>
  <g clip-path="url(#gate-shape)">
    <rect class="beam" x="360" y="160" width="80" height="60" fill="url(#beam)"/>
  </g>
  <circle class="ring" cx="400" cy="134" r="20" stroke-width="2"/>
  <g class="ok">
    <circle class="green" cx="400" cy="134" r="20"/>
    <path class="glyph draw" d="M391 134l6 6 12-13" pathLength="1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g class="no">
    <circle class="red" cx="400" cy="134" r="20"/>
    <path class="glyph draw" d="M393 127l14 14m0-14-14 14" pathLength="1" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text class="ink" x="400" y="204" font-size="13" font-weight="800" text-anchor="middle">Verifier</text>
  <text class="muted" x="400" y="222" font-size="11" text-anchor="middle">word for word</text>
  <text class="muted" x="400" y="238" font-size="11" text-anchor="middle">on the page?</text>
  <text class="muted" x="400" y="264" font-size="11" text-anchor="middle">checked</text>
  <text class="muted" x="400" y="280" font-size="11" text-anchor="middle">in code</text>
  <!-- The sentence on its way -->
  <g class="traveller">
    <rect class="shadow" x="42" y="164" width="176" height="24" rx="12"/>
    <rect class="mark" x="40" y="158" width="176" height="24" rx="12"/>
    <text class="ink" x="54" y="175" font-size="12" font-weight="700">Group Leader, Sensor Lab</text>
  </g>
  <!-- The profile -->
  <rect class="shadow" x="530" y="94" width="240" height="220" rx="14"/>
  <rect class="card" x="528" y="88" width="240" height="220" rx="14"/>
  <text class="muted" x="544" y="112" font-size="11" font-weight="700" letter-spacing="1">PROFILE</text>
  <text class="ink" x="544" y="140" font-size="17" font-weight="800">Ada Muster</text>
  <text class="muted" x="544" y="172" font-size="11">Role</text>
  <g class="claim">
    <rect class="green" x="544" y="182" width="208" height="30" rx="15"/>
    <text class="on-green" x="560" y="202" font-size="13" font-weight="800">Group Leader</text>
    <text class="on-green" x="738" y="202" font-size="11" font-weight="700" text-anchor="end">page ↗</text>
  </g>
  <g class="evidence">
    <text class="muted" x="544" y="236" font-size="11">Evidence: “Group Leader, Sensor Lab”</text>
    <text class="muted" x="544" y="254" font-size="11">with the page link, hash and date</text>
  </g>
  <!-- A proposal that is not on the page -->
  <g class="proposal">
    <rect class="card red-line" x="250" y="318" width="300" height="28" rx="14" stroke-dasharray="5 4"/>
    <text class="red" x="400" y="337" font-size="12" font-weight="700" text-anchor="middle">Model proposal: “Professor of Robotics”</text>
  </g>
  <text class="red dropped" x="400" y="364" font-size="11" text-anchor="middle">✕ not on the page, so it is dropped</text>
  <text class="muted" x="768" y="364" font-size="10" text-anchor="end">Example data is invented.</text>
</svg>
